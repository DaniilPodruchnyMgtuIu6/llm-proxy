services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-proxy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-llmproxy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-llmproxy}
      POSTGRES_DB: ${DB_NAME:-llmproxy}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-llmproxy} -d ${DB_NAME:-llmproxy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: llm-proxy-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-proxy:local
    container_name: llm-proxy-app
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Always talk to compose DNS name (overrides DB_HOST=localhost from local .env)
      ADDR: ":8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      OPENAPI_PATH: /app/api/openapi.yaml
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:
